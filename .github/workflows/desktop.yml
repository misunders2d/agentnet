name: desktop
# The AgentNet app for Windows, macOS and Linux (desktop/build.sh): the
# shell's own tests, then the installers, kept as artifacts for a week.
# Called by go.yml (every run) and release.yml (a release's version).
on:
  workflow_call:
    inputs:
      version:
        description: "Version stamped into the app (vX.Y.Z); empty: git describe"
        type: string
        default: ""
      ref:
        description: "Exact source ref; empty: caller's commit"
        type: string
        default: ""
      interaction_qualification:
        description: "Measure shared interactions in real native shells and browsers"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        # Linux on the oldest supported Ubuntu, so the AppImage runs on
        # older systems too.
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe names development builds
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - name: build the app
        shell: bash
        run: desktop/build.sh "${{ inputs.version }}"
      - name: the shell's tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - name: Linux AppImage replacement and restart
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' python3 scripts/test-appimage-update.py
      - name: native shell and browser interaction qualification
        if: inputs.interaction_qualification
        shell: bash
        env:
          AGENTNET_LATENCY_DISPOSABLE_GUI: '1'
          AGENTNET_LATENCY_SUITES: history,navigation,settings,unread,actions
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/agentnet-interactions"
          mkdir -p "$evidence"
          npm install --prefix "$RUNNER_TEMP/agentnet-browsers" --ignore-scripts --no-audit --no-fund playwright@1.63.0
          tooling="$RUNNER_TEMP/agentnet-browsers/node_modules"
          if [[ "$RUNNER_OS" == Linux ]]; then
            "$tooling/.bin/playwright" install --with-deps chromium firefox webkit
            export AGENTNET_NATIVE_SHELL="$GITHUB_WORKSPACE/desktop/src-tauri/target/release/agentnet-app"
            dbus-run-session -- xvfb-run -a -s '-screen 0 1440x960x24 -nolisten tcp' \
              go test ./internal/ui -run '^TestUIResponsivenessRendered$' -count=1 -timeout 180s -v 2>&1 | tee "$evidence/native.log"
          else
            "$tooling/.bin/playwright" install chromium firefox webkit
            if [[ "$RUNNER_OS" == macOS ]]; then
              export AGENTNET_NATIVE_SHELL="$GITHUB_WORKSPACE/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/AgentNet.app/Contents/MacOS/agentnet-app"
            else
              export AGENTNET_NATIVE_SHELL="$GITHUB_WORKSPACE/desktop/src-tauri/target/release/agentnet-app.exe"
            fi
            go test ./internal/ui -run '^TestUIResponsivenessRendered$' -count=1 -timeout 180s -v 2>&1 | tee "$evidence/native.log"
          fi
          unset AGENTNET_NATIVE_SHELL
          export AGENTNET_PLAYWRIGHT="$tooling/playwright"
          export AGENTNET_LATENCY_ENGINES=chromium,firefox,webkit
          export AGENTNET_LATENCY_VIEWPORTS=1440x960,390x844
          export AGENTNET_LATENCY_EVIDENCE="$evidence/browser.png"
          export AGENTNET_LATENCY_HOST_PLATFORM=browser
          go test ./internal/ui -run '^TestUIResponsivenessRendered$' -count=1 -timeout 600s -v 2>&1 | tee "$evidence/browser.log"
      - name: retain interaction timings and screenshots
        if: always() && inputs.interaction_qualification
        uses: actions/upload-artifact@v4
        with:
          name: interactions-${{ runner.os }}
          path: ${{ runner.temp }}/agentnet-interactions
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: agentnet-app-${{ runner.os }}
          path: desktop/out/AgentNet-*
          if-no-files-found: error
          retention-days: 7
