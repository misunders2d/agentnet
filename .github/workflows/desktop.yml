name: desktop
# The AgentNet app for Windows, macOS and Linux (desktop/build.sh): the
# shell's own tests, then the installers, kept as artifacts for a week.
# Called by go.yml (every run) and release.yml (a release's version).
on:
  workflow_call:
    inputs:
      version:
        description: "Version stamped into the app (vX.Y.Z); empty: git describe"
        type: string
        default: ""
      ref:
        description: "Exact source ref; empty: caller's commit"
        type: string
        default: ""
      os:
        description: 'Optional exact desktop runner matrix as JSON'
        type: string
        default: ''
      interaction_suites:
        description: 'Optional comma-separated affected workloads; empty retains all seventeen'
        type: string
        default: ''
      native_profile:
        description: 'Collect owned macOS renderer stacks for diagnosis only'
        type: boolean
        default: false
      paint_diagnostic:
        description: 'Isolate remaining renderer decorations on the same app; never qualification evidence'
        type: boolean
        default: false
      interaction_qualification:
        description: "Measure shared interactions in real native shells and browsers"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        # Linux on the oldest supported Ubuntu, so the AppImage runs on
        # older systems too.
        os: ${{ fromJSON(inputs.os || '["ubuntu-22.04","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe names development builds
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # The runner's Azure mirror stalled repeated candidate downloads.
          # Use Ubuntu's main signed archive; keep suites and package checks.
          # Some hosted images resolve a mirror+file source through this list.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$source" ]; then
              sudo sed -E -i 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - name: build the app
        shell: bash
        run: desktop/build.sh "${{ inputs.version }}"
      - name: the shell's tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - name: Linux AppImage replacement and restart
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' python3 scripts/test-appimage-update.py
      - name: native shell and browser interaction qualification
        if: inputs.interaction_qualification
        shell: bash
        env:
          AGENTNET_LATENCY_DISPOSABLE_GUI: '1'
          AGENTNET_NATIVE_PROFILE: ${{ inputs.native_profile && '1' || '' }}
          AGENTNET_PAINT_DIAGNOSTIC: ${{ inputs.paint_diagnostic && '1' || '' }}
          REQUESTED_INTERACTION_SUITES: ${{ inputs.interaction_suites }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/agentnet-interactions"
          mkdir -p "$evidence"
          if [[ "$AGENTNET_NATIVE_PROFILE" == 1 && "$RUNNER_OS" == macOS ]]; then
            export AGENTNET_NATIVE_PROFILE_DIR="$evidence/native-profile"
          fi
          npm install --prefix "$RUNNER_TEMP/agentnet-browsers" --ignore-scripts --no-audit --no-fund playwright@1.63.0
          tooling="$RUNNER_TEMP/agentnet-browsers/node_modules"
          if [[ "$RUNNER_OS" == Linux ]]; then
            "$tooling/.bin/playwright" install --with-deps chromium firefox webkit
            # Qualify the shipped runtime, including its bundled media plugins.
            image="$GITHUB_WORKSPACE/desktop/out/AgentNet-linux-x86_64.AppImage"
            extraction="$RUNNER_TEMP/agentnet-interaction-appimage"
            mkdir -p "$extraction"
            (cd "$extraction" && "$image" --appimage-extract > "$evidence/appimage-extraction.log")
            export AGENTNET_NATIVE_SHELL="$extraction/squashfs-root/usr/bin/agentnet-app"
          else
            if [[ "$RUNNER_OS" == Windows ]]; then
              # The disposable Server runner needs Playwright's media pack.
              "$tooling/.bin/playwright" install --with-deps chromium firefox webkit
            else
              "$tooling/.bin/playwright" install chromium firefox webkit
            fi
            if [[ "$RUNNER_OS" == macOS ]]; then
              export AGENTNET_NATIVE_SHELL="$GITHUB_WORKSPACE/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/AgentNet.app/Contents/MacOS/agentnet-app"
            else
              export AGENTNET_NATIVE_SHELL="$GITHUB_WORKSPACE/desktop/src-tauri/target/release/agentnet-app.exe"
            fi
          fi
          # Split added workloads rather than increasing any existing bound.
          groups=(history,navigation,settings,unread,actions topics,groups,compose,media review,outbox,agents,teams profile,storage,workspaces,permissions)
          if [[ -n "$REQUESTED_INTERACTION_SUITES" ]]; then
            IFS=, read -r -a groups <<< "$REQUESTED_INTERACTION_SUITES"
            for suites in "${groups[@]}"; do
              case "$suites" in
                history|navigation|settings|unread|actions|topics|groups|compose|media|review|outbox|agents|teams|profile|storage|workspaces|permissions) ;;
                *) echo "Unknown interaction workload: $suites" >&2; exit 1 ;;
              esac
            done
          fi
          failed=0
          native_shell="$AGENTNET_NATIVE_SHELL"
          modes=(qualification)
          if [[ "$AGENTNET_PAINT_DIAGNOSTIC" == 1 ]]; then
            [[ "$RUNNER_OS" == macOS ]]
            modes=(baseline no-shadow no-radius no-filter no-scrim)
          fi
          for mode in "${modes[@]}"; do
            export AGENTNET_NATIVE_SHELL="$native_shell"
            unset AGENTNET_PLAYWRIGHT AGENTNET_LATENCY_HOST_PLATFORM AGENTNET_LATENCY_PAINT_DIAGNOSTIC
            if [[ "$mode" != qualification ]]; then export AGENTNET_LATENCY_PAINT_DIAGNOSTIC="$mode"; fi
            for suites in "${groups[@]}"; do
              export AGENTNET_LATENCY_SUITES="$suites"
              if [[ "$RUNNER_OS" == Linux ]]; then
                if ! dbus-run-session -- xvfb-run -a -s '-screen 0 1440x960x24 -nolisten tcp' \
                  go test ./internal/ui -run '^TestUIResponsivenessRendered$' -count=1 -timeout 180s -v 2>&1 | tee "$evidence/native-$mode-$suites.log"; then failed=1; fi
              else
                if ! go test ./internal/ui -run '^TestUIResponsivenessRendered$' -count=1 -timeout 180s -v 2>&1 | tee "$evidence/native-$mode-$suites.log"; then failed=1; fi
              fi
            done
            unset AGENTNET_NATIVE_SHELL
            export AGENTNET_PLAYWRIGHT="$tooling/playwright"
            export AGENTNET_LATENCY_HOST_PLATFORM=browser
            for suites in "${groups[@]}"; do
              export AGENTNET_LATENCY_SUITES="$suites"
              export AGENTNET_LATENCY_EVIDENCE="$evidence/browser-$mode-$suites.png"
              export AGENTNET_LATENCY_ENGINES=chromium,firefox,webkit
              export AGENTNET_LATENCY_VIEWPORTS=1440x960,390x844
              if ! go test ./internal/ui -run '^TestUIResponsivenessRendered$' -count=1 -timeout 600s -v 2>&1 | tee "$evidence/browser-$mode-$suites.log"; then failed=1; fi
            done
          done
          exit "$failed"
      - name: retain interaction timings and screenshots
        if: always() && inputs.interaction_qualification
        uses: actions/upload-artifact@v4
        with:
          name: interactions-${{ inputs.os && matrix.os || runner.os }}
          path: ${{ runner.temp }}/agentnet-interactions
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ success() || (failure() && inputs.interaction_qualification) }}
        with:
          name: agentnet-app-${{ inputs.os && matrix.os || runner.os }}
          path: desktop/out/AgentNet-*
          if-no-files-found: error
          retention-days: 7
