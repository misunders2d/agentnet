name: go
on:
  push:
    branches: [main, revival/mvp]
  pull_request:
  workflow_dispatch:
    inputs:
      test_packages:
        description: "Focused native qualification: space-separated Go packages (empty runs the full workflow)"
        type: string
        default: ''
      test_run:
        description: "Optional Go test -run expression for focused native qualification"
        type: string
        default: ''
      test_count:
        description: "Repeat a focused native selection while investigating an intermittent failure"
        type: string
        default: '1'
      race_shards:
        description: 'Run only these race shards (JSON array, e.g. ["client-0","client-6"]); empty uses the full workflow'
        type: string
        default: ''
      native_os:
        description: 'Native runner selection as a JSON array; empty uses all three systems'
        type: string
        default: ''
      windows_client_partitions:
        description: 'Rerun only these failed native Windows client partitions (JSON array); empty keeps all six'
        type: string
        default: ''
      desktop_os:
        description: 'Optional exact desktop runner matrix as JSON; selects desktop qualification without repeating Android'
        type: string
        default: ''
      include_android:
        description: 'Also run Android qualification with an explicit desktop runner selection'
        type: boolean
        default: false
      interaction_suites:
        description: 'Optional comma-separated affected desktop workloads; empty retains all seventeen'
        type: string
        default: ''
      native_profile:
        description: 'Collect macOS renderer stacks for diagnosis; profiled runs are not release timing evidence'
        type: boolean
        default: false
      android_suites:
        description: 'Optional comma-separated affected Android workloads; empty keeps all seventeen'
        type: string
        default: ''
      platform_only:
        description: 'Run only desktop and Android qualification, retaining completed native/race jobs'
        type: boolean
        default: false
      candidate_version:
        description: 'Optional exact candidate version for desktop and Android qualification'
        type: string
        default: ''
      interaction_qualification:
        description: 'Also measure all shared GUI workloads in the desktop builds'
        type: boolean
        default: false
      windows_task_probe:
        description: "Run only the native Windows Task Scheduler tests (the probe's private task, and the task agentnet for the update switch; both removed afterwards)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    if: ${{ !inputs.windows_task_probe && !inputs.platform_only && !inputs.race_shards && !inputs.windows_client_partitions }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.native_os || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      # Native checks use published source too: the Linux mixed-version
      # gate builds a release tag, and browser wire compatibility executes
      # the published parser on every OS.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Browser wire tests need WebCrypto; Pi extension tests load TypeScript.
      # Do not let the runner's default Node silently skip these checks.
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: pinned UI test tooling
        if: ${{ !inputs.test_packages || contains(inputs.test_packages, './...') || contains(inputs.test_packages, 'internal/ui') }}
        working-directory: internal/ui/web
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "require('./node_modules/esbuild').transformSync('')"
      - run: go vet ./...
      - name: rendered interaction recovery
        if: ${{ (!inputs.test_run || contains(inputs.test_run, 'Rendered')) && (!inputs.test_packages || contains(inputs.test_packages, './...') || contains(inputs.test_packages, 'internal/ui')) }}
        shell: bash
        env:
          AGENTNET_RENDERED_RUN: ${{ inputs.test_run || '^(TestLocalChangesRendered|TestPictureChangesRendered|TestReminderChangesRendered|TestResponsiveEditorDraftsRendered|TestReactionPendingRendered|TestPaneEntranceRendered|TestSheetImmediateRendered|TestMessagePopupsImmediateRendered|TestTimelineNavigationRendered|TestTimelineKeyboardRendered|TestFirstUnreadTimelineRendered)$' }}
          AGENTNET_RENDERED_COUNT: ${{ inputs.test_count || '1' }}
        run: |
          tooling="$RUNNER_TEMP/agentnet-interaction-regressions"
          npm install --prefix "$tooling" --ignore-scripts --no-audit --no-fund playwright@1.63.0
          "$tooling/node_modules/.bin/playwright" install --with-deps chromium
          export AGENTNET_PLAYWRIGHT="$tooling/node_modules/playwright"
          export AGENTNET_CHROMIUM="$(node -p 'require(process.env.AGENTNET_PLAYWRIGHT).chromium.executablePath()')"
          go test -count="$AGENTNET_RENDERED_COUNT" -timeout 600s -v ./internal/ui -run "$AGENTNET_RENDERED_RUN"
      - name: message controls on macOS WebKit
        if: ${{ runner.os == 'macOS' && (!inputs.test_packages || contains(inputs.test_packages, './...') || contains(inputs.test_packages, 'internal/ui')) }}
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/agentnet-webkit" --ignore-scripts --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/agentnet-webkit/node_modules/.bin/playwright" install webkit
          export AGENTNET_PLAYWRIGHT="$RUNNER_TEMP/agentnet-webkit/node_modules/playwright"
          export AGENTNET_INTERACTION_ENGINE=webkit
          export AGENTNET_INTERACTION_HEADED=1
          export INTERACTION_EVIDENCE="$RUNNER_TEMP/agentnet-macos-controls.png"
          go test -count=1 -timeout 180s -run '^TestMessageInteractionRendered$' -v ./internal/ui
      - name: retain macOS control evidence
        if: ${{ always() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-message-controls
          path: ${{ runner.temp }}/agentnet-macos-controls.png
          if-no-files-found: ignore
      # Expanded suite needs time on slow CI disks; individual assertions stay bounded.
      - name: test (real binaries and processes on this OS)
        shell: bash
        env:
          AGENTNET_TEST_PACKAGES: ${{ inputs.test_packages || './...' }}
          AGENTNET_TEST_RUN: ${{ inputs.test_run || '.' }}
          AGENTNET_TEST_COUNT: ${{ inputs.test_count || '1' }}
          AGENTNET_FULL_NATIVE: ${{ !inputs.test_packages && !inputs.test_run }}
          AGENTNET_REQUIRE_COMPAT: ${{ startsWith(matrix.os, 'ubuntu') && '1' || '' }}
        run: |
          read -r -a packages <<< "$AGENTNET_TEST_PACKAGES"
          if [[ "$RUNNER_OS" == Windows && "$AGENTNET_FULL_NATIVE" == true ]]; then
            # The windows-client matrix owns this package in full qualification.
            other_packages=$(go list ./... | awk '!/\/internal\/client$/')
            mapfile -t packages <<< "$other_packages"
          fi
          go test -count="$AGENTNET_TEST_COUNT" -timeout 1800s -run "$AGENTNET_TEST_RUN" "${packages[@]}"
  # Each Windows client partition owns a runner: simultaneous test binaries on
  # one Windows disk exhausted 1800s even before the responsiveness changes.
  windows-client:
    if: ${{ !inputs.windows_task_probe && !inputs.platform_only && !inputs.race_shards && !inputs.test_packages && !inputs.test_run && (!inputs.native_os || contains(fromJSON(inputs.native_os), 'windows-latest')) }}
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON(inputs.windows_client_partitions || '[0,1,2,3,4,5]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: client (native Windows partition ${{ matrix.partition }} of 6)
        shell: bash
        env:
          AGENTNET_TEST_COUNT: ${{ inputs.test_count || '1' }}
          AGENTNET_NATIVE_PARTITION: ${{ matrix.partition }}
        run: bash scripts/native-client-shard.sh "$AGENTNET_NATIVE_PARTITION" 6
  # The race suite on Linux, split over parallel runners: internal/client's
  # tests in bounded client shards, every other package in one. Focused
  # dispatch retains passing evidence when only some shards need a rerun.
  race:
    if: ${{ !inputs.windows_task_probe && !inputs.platform_only && !inputs.windows_client_partitions && (inputs.race_shards || (!inputs.test_packages && !inputs.test_run)) }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.race_shards || '["client-0","client-1","client-2","client-3","client-4","client-5","client-6","client-7","client-8","client-9","client-10","client-11","client-12","client-13","client-14","client-15","client-16","client-17","others"]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # UI wire compatibility runs the actual published browser parser.
          fetch-depth: ${{ (matrix.shard == 'others' || startsWith(matrix.shard, 'ui-')) && '0' || '1' }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: pinned UI test tooling
        if: matrix.shard == 'others' || startsWith(matrix.shard, 'ui-')
        working-directory: internal/ui/web
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "require('./node_modules/esbuild').transformSync('')"
      - name: race (${{ matrix.shard }})
        env:
          AGENTNET_RACE_SHARD: ${{ matrix.shard }}
        run: scripts/race-shard.sh "$AGENTNET_RACE_SHARD" 18
      - name: browser storage (real IndexedDB, headless)
        if: matrix.shard == 'others' || matrix.shard == 'ui-1'
        shell: bash
        run: |
          export AGENTNET_CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          test -n "$AGENTNET_CHROME"
          go test -race -count=1 -timeout 90s -run '^TestDeviceStoreInChrome$' -v ./internal/ui/static
  # The AgentNet app's installers for the three systems (desktop.yml).
  desktop:
    if: ${{ !inputs.windows_task_probe && !inputs.test_packages && !inputs.test_run && !inputs.race_shards && !inputs.windows_client_partitions }}
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ inputs.candidate_version || '' }}
      os: ${{ inputs.desktop_os || '' }}
      interaction_suites: ${{ inputs.interaction_suites || '' }}
      native_profile: ${{ inputs.native_profile || false }}
      interaction_qualification: ${{ inputs.interaction_qualification || false }}
  container:
    if: ${{ !inputs.windows_task_probe && !inputs.platform_only && !inputs.test_packages && !inputs.test_run && !inputs.race_shards && !inputs.windows_client_partitions }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the product image from the repository Dockerfile
        run: docker build --build-arg VERSION=ci-${{ github.sha }} --tag agentnet-hub:ci .
      - name: container journey against that image
        run: scripts/hub-container-test.sh
        env:
          AGENTNET_TEST_IMAGE: agentnet-hub:ci
  # Manual complete candidate qualification also exercises the existing signed
  # Android preview on an owned emulator. The reusable workflow accepts exact
  # versions when invoked separately; here it derives the next patch from tags.
  android-qualification:
    if: ${{ github.event_name == 'workflow_dispatch' && (!inputs.desktop_os || inputs.include_android) && !inputs.windows_task_probe && !inputs.test_packages && !inputs.test_run && !inputs.race_shards && !inputs.native_os && !inputs.windows_client_partitions }}
    uses: ./.github/workflows/android-qualification.yml
    with:
      version: ${{ inputs.candidate_version || '' }}
      latency_suites: ${{ inputs.android_suites || '' }}
    secrets:
      ANDROID_PREVIEW_KEYSTORE_BASE64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
  windows-task-probe:
    if: ${{ inputs.windows_task_probe }}
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The probe uses a private task; the update test creates the task
      # agentnet itself (it refuses to run where one exists). Both remove
      # what they create. Bounds: builds, task starts with a fallback
      # principal, and the update test's slowest path (a task that cannot
      # start: three bounded tries) fit well inside 1800 s.
      - name: Task Scheduler probe and update switch through the task
        run: go test -count=1 -timeout 1800s -run "TestWindowsTaskSwitchProbe|TestWindowsUpdateSwitchThroughTask" -v ./itest
        env:
          AGENTNET_WINTASK: "1"
