name: go
on:
  push:
    branches: [main, revival/mvp]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_task_probe:
        description: "Run only the native Windows Task Scheduler probe (creates and removes a private task)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    if: ${{ !inputs.windows_task_probe }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: test (real binaries and processes on this OS)
        run: go test -count=1 -timeout 900s ./...
      - name: race
        if: runner.os == 'Linux'
        run: go test -race -count=1 -timeout 900s ./...
  container:
    if: ${{ !inputs.windows_task_probe }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the product image from the repository Dockerfile
        run: docker build --build-arg VERSION=ci-${{ github.sha }} --tag agentnet-hub:ci .
      - name: container journey against that image
        run: scripts/hub-container-test.sh
        env:
          AGENTNET_TEST_IMAGE: agentnet-hub:ci
  windows-task-probe:
    if: ${{ inputs.windows_task_probe }}
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Task Scheduler probe (private task, removed afterwards)
        run: go test -count=1 -timeout 300s -run TestWindowsTaskSwitchProbe -v ./itest
        env:
          AGENTNET_WINTASK: "1"
