name: go
on:
  push:
    branches: [main, revival/mvp]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_task_probe:
        description: "Run only the native Windows Task Scheduler tests (the probe's private task, and the task agentnet for the update switch; both removed afterwards)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    if: ${{ !inputs.windows_task_probe }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Browser wire tests need WebCrypto; Pi extension tests load TypeScript.
      # Do not let the runner's default Node silently skip these checks.
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: go vet ./...
      # Expanded suite needs time on slow CI disks; individual assertions stay bounded.
      - name: test (real binaries and processes on this OS)
        run: go test -count=1 -timeout 1800s ./...
  # The race suite on Linux, split over parallel runners: internal/client's
  # tests in six shards (scripts/race-shard.sh), every other package in one.
  race:
    if: ${{ !inputs.windows_task_probe }}
    strategy:
      fail-fast: false
      matrix:
        shard: [client-0, client-1, client-2, client-3, client-4, client-5, others]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: race (${{ matrix.shard }})
        run: scripts/race-shard.sh ${{ matrix.shard }} 6
      - name: browser storage (real IndexedDB, headless)
        if: matrix.shard == 'others'
        shell: bash
        run: |
          export AGENTNET_CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          test -n "$AGENTNET_CHROME"
          go test -race -count=1 -timeout 90s -run '^TestDeviceStoreInChrome$' -v ./internal/ui/static
  container:
    if: ${{ !inputs.windows_task_probe }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the product image from the repository Dockerfile
        run: docker build --build-arg VERSION=ci-${{ github.sha }} --tag agentnet-hub:ci .
      - name: container journey against that image
        run: scripts/hub-container-test.sh
        env:
          AGENTNET_TEST_IMAGE: agentnet-hub:ci
  windows-task-probe:
    if: ${{ inputs.windows_task_probe }}
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The probe uses a private task; the update test creates the task
      # agentnet itself (it refuses to run where one exists). Both remove
      # what they create. Bounds: builds, task starts with a fallback
      # principal, and the update test's slowest path (a task that cannot
      # start: three bounded tries) fit well inside 1800 s.
      - name: Task Scheduler probe and update switch through the task
        run: go test -count=1 -timeout 1800s -run "TestWindowsTaskSwitchProbe|TestWindowsUpdateSwitchThroughTask" -v ./itest
        env:
          AGENTNET_WINTASK: "1"
