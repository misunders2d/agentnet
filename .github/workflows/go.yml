name: go
on:
  push:
    branches: [main, revival/mvp]
  pull_request:
  workflow_dispatch:
    inputs:
      test_packages:
        description: "Focused native qualification: space-separated Go packages (empty runs the full workflow)"
        type: string
        default: ''
      test_run:
        description: "Optional Go test -run expression for focused native qualification"
        type: string
        default: ''
      race_shards:
        description: 'Run only these race shards (JSON array, e.g. ["client-0","client-6"]); empty uses the full workflow'
        type: string
        default: ''
      native_os:
        description: 'Native runner selection as a JSON array; empty uses all three systems'
        type: string
        default: ''
      windows_task_probe:
        description: "Run only the native Windows Task Scheduler tests (the probe's private task, and the task agentnet for the update switch; both removed afterwards)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    if: ${{ !inputs.windows_task_probe && !inputs.race_shards }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.native_os || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Browser wire tests need WebCrypto; Pi extension tests load TypeScript.
      # Do not let the runner's default Node silently skip these checks.
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: go vet ./...
      # Expanded suite needs time on slow CI disks; individual assertions stay bounded.
      - name: test (real binaries and processes on this OS)
        shell: bash
        env:
          AGENTNET_TEST_PACKAGES: ${{ inputs.test_packages || './...' }}
          AGENTNET_TEST_RUN: ${{ inputs.test_run || '.' }}
        run: |
          read -r -a packages <<< "$AGENTNET_TEST_PACKAGES"
          go test -count=1 -timeout 1800s -run "$AGENTNET_TEST_RUN" "${packages[@]}"
  # The race suite on Linux, split over parallel runners: internal/client's
  # tests in twelve bounded shards, every other package in one. Focused
  # dispatch retains passing evidence when only some shards need a rerun.
  race:
    if: ${{ !inputs.windows_task_probe && (inputs.race_shards || (!inputs.test_packages && !inputs.test_run)) }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.race_shards || '["client-0","client-1","client-2","client-3","client-4","client-5","client-6","client-7","client-8","client-9","client-10","client-11","others"]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: race (${{ matrix.shard }})
        env:
          AGENTNET_RACE_SHARD: ${{ matrix.shard }}
        run: scripts/race-shard.sh "$AGENTNET_RACE_SHARD" 12
      - name: browser storage (real IndexedDB, headless)
        if: matrix.shard == 'others'
        shell: bash
        run: |
          export AGENTNET_CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          test -n "$AGENTNET_CHROME"
          go test -race -count=1 -timeout 90s -run '^TestDeviceStoreInChrome$' -v ./internal/ui/static
  # The AgentNet app's installers for the three systems (desktop.yml).
  desktop:
    if: ${{ !inputs.windows_task_probe && !inputs.test_packages && !inputs.test_run && !inputs.race_shards }}
    uses: ./.github/workflows/desktop.yml
  container:
    if: ${{ !inputs.windows_task_probe && !inputs.test_packages && !inputs.test_run && !inputs.race_shards }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the product image from the repository Dockerfile
        run: docker build --build-arg VERSION=ci-${{ github.sha }} --tag agentnet-hub:ci .
      - name: container journey against that image
        run: scripts/hub-container-test.sh
        env:
          AGENTNET_TEST_IMAGE: agentnet-hub:ci
  windows-task-probe:
    if: ${{ inputs.windows_task_probe }}
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The probe uses a private task; the update test creates the task
      # agentnet itself (it refuses to run where one exists). Both remove
      # what they create. Bounds: builds, task starts with a fallback
      # principal, and the update test's slowest path (a task that cannot
      # start: three bounded tries) fit well inside 1800 s.
      - name: Task Scheduler probe and update switch through the task
        run: go test -count=1 -timeout 1800s -run "TestWindowsTaskSwitchProbe|TestWindowsUpdateSwitchThroughTask" -v ./itest
        env:
          AGENTNET_WINTASK: "1"
