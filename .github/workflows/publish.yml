name: Stage npm release

on:
  push:
    tags:
      - "v*"
  # One bounded recovery for immutable v0.1.31. The original tag run completed
  # every source and recursive packed suite, then its final no-apply setup probe
  # rejected an unsafe GitHub-hosted Node executable with a different safe
  # fail-closed blocker than the checker expected.
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  stage:
    if: github.repository == 'misunders2d/agentnet'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && 'v0.1.31' || github.ref }}

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install pinned npm CLI
        run: |
          npm install --global npm@12.0.1 --ignore-scripts
          test "$(npm --version)" = "12.0.1"

      - name: Configure uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13.13"
          enable-cache: false

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$(git rev-parse HEAD)" = "dc10f86c9ac15ffc29c4dd5dd37e6c6d5bf15382"
            test "$PACKAGE_VERSION" = "0.1.31"
          else
            test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
          fi

      - name: Verify exact v0.1.31 recovery evidence
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/30458919348 --jq .head_sha)" = "dc10f86c9ac15ffc29c4dd5dd37e6c6d5bf15382"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/30458919348 --jq .conclusion)" = "failure"
          gh run view 30458919348 --log-failed > /tmp/v0.1.31-failed.log
          grep -F "1549 passed, 16 skipped" /tmp/v0.1.31-failed.log
          grep -F "blocker=unsafe_executable" /tmp/v0.1.31-failed.log

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      # AgentNet's prepublishOnly script runs package checks, the test suite,
      # and release-manifest verification before npm accepts the staged package.
      - name: Stage package
        if: github.event_name != 'workflow_dispatch'
        run: npm stage publish --access public

      # Exact recovery only. Run 30458919348 already completed both 1549-test
      # generations and release verification; only its host-dependent expected
      # blocker assertion failed. --ignore-scripts stages unchanged tagged bytes.
      - name: Stage exact v0.1.31 recovery
        if: github.event_name == 'workflow_dispatch'
        run: npm stage publish --access public --ignore-scripts
