name: Stage npm release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to stage
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  released-upgrade-chain:
    if: github.repository == 'misunders2d/agentnet'
    uses: ./.github/workflows/server-setup-upgrade-e2e.yml

  stage:
    if: github.repository == 'misunders2d/agentnet'
    needs: released-upgrade-chain
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install pinned npm CLI
        run: |
          npm install --global npm@12.0.1 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "12.0.1"

      - name: Configure uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13.13"
          enable-cache: false

      - name: Install Linux Manager sandbox
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor-profiles apparmor-utils bubblewrap
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test -x /usr/bin/bwrap
          test "$(stat -c '%u:%a' /usr/bin/bwrap)" = "0:755"
          bwrap --unshare-user --die-with-parent --ro-bind / / /usr/bin/true

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      # AgentNet's prepublishOnly script runs package checks, the test suite,
      # and release-manifest verification before npm accepts the staged package.
      - name: Stage package
        shell: bash
        run: |
          umask 022
          npm stage publish --access public
