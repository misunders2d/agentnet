<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AgentNet</title>
<style>
:root { color-scheme: light dark; --bg: #f4f5f7; --fg: #1d2330; --muted: #5b6475; }
@media (prefers-color-scheme: dark) { :root { --bg: #14171d; --fg: #e8ebf1; --muted: #a2a9b8; } }
html, body { height: 100%; margin: 0; }
body { display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 0 16px; }
main { max-width: 28rem; }
h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
p { color: var(--muted); margin: 0; overflow-wrap: anywhere; }
.retry { display: inline-block; margin-top: 1rem; padding: .5rem 1.25rem; border-radius: 999px; background: #4b45d6; color: #fff; text-decoration: none; font-weight: 600; }
</style>
<script src="splash.js" defer></script>
</head>
<body><main><h1>Starting AgentNet…</h1><p>This takes a moment the first time.</p></main></body>
</html>
