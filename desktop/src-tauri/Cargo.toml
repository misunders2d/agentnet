[package]
name = "agentnet-app"
version = "0.0.0"
description = "AgentNet: the desktop app's shell around the agentnet program"
license = "Apache-2.0"
edition = "2021"
publish = false

[[bin]]
name = "agentnet-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2.5.2", features = ["deep-link"] }
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-opener = "2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
