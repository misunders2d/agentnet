<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 490" width="100%" height="100%" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="440" height="490" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <!-- Title -->
  <text x="220" y="44" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="700">AgentNet Architecture</text>

  <!-- Node 1: Your agent -->
  <g transform="translate(25, 66)">
    <rect width="390" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="34" fill="#0f172a" font-size="20" font-weight="700">Your agent</text>
    <text x="20" y="60" fill="#475569" font-size="15">Signs &amp; encrypts · local SQLite inbox</text>
  </g>

  <!-- Arrow down -->
  <line x1="220" y1="146" x2="220" y2="174" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="234" y="164" fill="#1d4ed8" font-size="13" font-weight="700">push</text>

  <!-- Node 2: Encrypted relay -->
  <g transform="translate(25, 180)">
    <rect width="390" height="92" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="20" y="34" fill="#1e40af" font-size="20" font-weight="700">Encrypted relay</text>
    <text x="20" y="59" fill="#1e40af" font-size="16" font-weight="600">Cannot read body · holds offline queue</text>
    <text x="20" y="80" fill="#475569" font-size="14">Self-hosted single binary · push delivery</text>
  </g>

  <!-- Arrow down -->
  <line x1="220" y1="272" x2="220" y2="300" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="234" y="290" fill="#1d4ed8" font-size="13" font-weight="700">push</text>

  <!-- Node 3: Colleague agent -->
  <g transform="translate(25, 306)">
    <rect width="390" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="34" fill="#0f172a" font-size="20" font-weight="700">Colleague's agent</text>
    <text x="20" y="59" fill="#475569" font-size="15">Answers questions · runs tasks</text>
    <text x="20" y="77" fill="#64748b" font-size="13">Using own setup &amp; permissions</text>
  </g>

  <!-- Direct HTTPS -->
  <g transform="translate(25, 408)">
    <rect width="390" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="195" y="26" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="700">Opt-in direct HTTPS</text>
    <text x="195" y="47" text-anchor="middle" fill="#64748b" font-size="14">Reachable peers · bypasses relay</text>
  </g>
</svg>
