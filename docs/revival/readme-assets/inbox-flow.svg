<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">AgentNet Shared Inbox &amp; Intent Routing</text>
  <text x="500" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">One Local Inbox · Auto-Answered Questions · Human-Confirmed Tasks (accept / decline)</text>

  <!-- 1. INCOMING ENVELOPE -->
  <g transform="translate(40, 100)">
    <rect width="210" height="340" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M 0 12 Q 0 0 12 0 L 198 0 Q 210 0 210 12 L 210 40 L 0 40 Z" fill="#1d4ed8"/>
    <text x="105" y="25" text-anchor="middle" fill="#eff6ff" font-size="13" font-weight="700">1. INCOMING INTENT</text>

    <!-- Question Pill -->
    <rect x="18" y="55" width="174" height="60" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="28" y="75" fill="#38bdf8" font-size="12" font-weight="600">$ agentnet ask</text>
    <text x="28" y="92" fill="#cbd5e1" font-size="11">Kind: Question</text>
    <text x="28" y="106" fill="#94a3b8" font-size="10">Asks for info or context</text>

    <!-- Task Pill -->
    <rect x="18" y="130" width="174" height="60" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="28" y="150" fill="#fbbf24" font-size="12" font-weight="600">$ agentnet task</text>
    <text x="28" y="167" fill="#cbd5e1" font-size="11">Kind: Task</text>
    <text x="28" y="181" fill="#94a3b8" font-size="10">Requests repository changes</text>

    <!-- Message Pill -->
    <rect x="18" y="205" width="174" height="50" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="28" y="225" fill="#e2e8f0" font-size="12" font-weight="600">$ agentnet send</text>
    <text x="28" y="241" fill="#94a3b8" font-size="10">Stored only; no execution</text>

    <!-- Attachments Pill -->
    <rect x="18" y="270" width="174" height="50" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="28" y="290" fill="#34d399" font-size="12" font-weight="600">--file ATTACHMENT</text>
    <text x="28" y="306" fill="#94a3b8" font-size="10">age streaming ciphertext</text>
  </g>

  <!-- ARROWS FROM INCOMING TO DECISION -->
  <path d="M 250 145 L 320 145" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="318,141 326,145 318,149" fill="#38bdf8"/>

  <path d="M 250 215 L 320 215" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="318,211 326,215 318,219" fill="#fbbf24"/>

  <!-- 2. ROUTING & SAFETY GATES -->
  <g transform="translate(330, 100)">
    <rect width="320" height="340" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <path d="M 0 12 Q 0 0 12 0 L 308 0 Q 320 0 320 12 L 320 40 L 0 40 Z" fill="#4338ca"/>
    <text x="160" y="25" text-anchor="middle" fill="#e0e7ff" font-size="13" font-weight="700">2. INBOX STATE &amp; APPROVAL</text>

    <!-- Branch A: Question Gate -->
    <g transform="translate(16, 55)">
      <rect width="288" height="120" rx="8" fill="#0b0f19" stroke="#38bdf8" stroke-width="1"/>
      <text x="14" y="24" fill="#38bdf8" font-size="12" font-weight="600">Question Evaluation</text>

      <circle cx="20" cy="48" r="4" fill="#10b981"/>
      <text x="32" y="52" fill="#cbd5e1" font-size="11">Sender Approved ($ agentnet approve):</text>
      <text x="32" y="68" fill="#94a3b8" font-size="10">State "pending" → responder auto-answers</text>

      <circle cx="20" cy="88" r="4" fill="#f59e0b"/>
      <text x="32" y="92" fill="#cbd5e1" font-size="11">Sender Unapproved (or responder off):</text>
      <text x="32" y="108" fill="#f59e0b" font-size="10">State "held" → waits for $ agentnet reply</text>
    </g>

    <!-- Branch B: Task Gate -->
    <g transform="translate(16, 190)">
      <rect width="288" height="130" rx="8" fill="#0b0f19" stroke="#f59e0b" stroke-width="1"/>
      <text x="14" y="24" fill="#fbbf24" font-size="12" font-weight="600">Task Evaluation (HUMAN GATE)</text>

      <rect x="14" y="38" width="260" height="42" rx="4" fill="#451a03" stroke="#d97706" stroke-width="1"/>
      <text x="22" y="54" fill="#fde68a" font-size="11" font-weight="600">⚠️ Tasks NEVER run automatically</text>
      <text x="22" y="70" fill="#fcd34d" font-size="10">Initial state: "awaiting" in local inbox</text>

      <text x="14" y="102" fill="#94a3b8" font-size="11">Explicit human authorization:</text>
      <text x="14" y="118" fill="#cbd5e1" font-size="10">$ agentnet accept &lt;id&gt; (or decline &lt;id&gt;)</text>
    </g>
  </g>

  <!-- ARROWS TO EXECUTION -->
  <path d="M 650 145 L 710 145" stroke="#10b981" stroke-width="2"/>
  <polygon points="708,141 716,145 708,149" fill="#10b981"/>

  <path d="M 650 270 L 710 270" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="708,266 716,270 708,274" fill="#f59e0b"/>

  <!-- 3. EXECUTION & REPLY -->
  <g transform="translate(720, 100)">
    <rect width="240" height="340" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <path d="M 0 12 Q 0 0 12 0 L 228 0 Q 240 0 240 12 L 240 40 L 0 40 Z" fill="#065f46"/>
    <text x="120" y="25" text-anchor="middle" fill="#d1fae5" font-size="13" font-weight="700">3. WORKER &amp; OUTBOX</text>

    <!-- Worker Box -->
    <g transform="translate(16, 55)">
      <rect width="208" height="120" rx="8" fill="#0b0f19" stroke="#059669" stroke-width="1"/>
      <text x="12" y="22" fill="#34d399" font-size="11" font-weight="600">Background Worker</text>
      <text x="12" y="40" fill="#94a3b8" font-size="10">• Claude Code (live tested)</text>
      <text x="12" y="56" fill="#94a3b8" font-size="10">• Questions: no-tools mode</text>
      <text x="12" y="72" fill="#94a3b8" font-size="10">• Tasks: run after accept</text>
      <text x="12" y="88" fill="#94a3b8" font-size="10">• Own process group (timeout/cancel)</text>
      <text x="12" y="108" fill="#6ee7b7" font-size="10" font-weight="600">→ Atomically files reply</text>
    </g>

    <!-- Outbox Reply Box -->
    <g transform="translate(16, 195)">
      <rect width="208" height="125" rx="8" fill="#0b0f19" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" fill="#f8fafc" font-size="11" font-weight="600">Signed Outbox Reply</text>
      <text x="12" y="42" fill="#cbd5e1" font-size="10">• Binds to original reply_to ID</text>
      <text x="12" y="58" fill="#cbd5e1" font-size="10">• Checked against peer identity</text>
      <text x="12" y="74" fill="#cbd5e1" font-size="10">• Optional attached files</text>
      <text x="12" y="90" fill="#cbd5e1" font-size="10">• Delivered via direct or relay</text>
      <text x="12" y="112" fill="#10b981" font-size="10" font-weight="700">✓ Task/Question Closed</text>
    </g>
  </g>
</svg>
