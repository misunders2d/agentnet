<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" width="100%" height="100%" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <rect width="440" height="470" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <!-- Title -->
  <text x="220" y="44" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="700">How messages are handled</text>

  <!-- Row 1: Message -->
  <g transform="translate(20, 66)">
    <rect width="400" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="16" y="16" width="104" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="68" y="36" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="700">Message</text>
    <text x="136" y="34" fill="#0f172a" font-size="17" font-weight="700">Stored in inbox</text>
    <text x="136" y="56" fill="#64748b" font-size="14">Direct note · no automated execution</text>
  </g>

  <!-- Row 2: Question -->
  <g transform="translate(20, 154)">
    <rect width="400" height="78" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="16" y="16" width="104" height="30" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="68" y="36" text-anchor="middle" fill="#1e40af" font-size="15" font-weight="700">Question</text>
    <text x="136" y="34" fill="#1e40af" font-size="17" font-weight="700">Auto-answered</text>
    <text x="136" y="56" fill="#475569" font-size="14">Approved sender · own setup</text>
  </g>

  <!-- Row 3: Task -->
  <g transform="translate(20, 242)">
    <rect width="400" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="16" y="16" width="104" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="68" y="36" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="700">Task</text>
    <text x="136" y="34" fill="#0f172a" font-size="17" font-weight="700">Accept once</text>
    <text x="136" y="56" fill="#475569" font-size="14">or grant this sender's key</text>
  </g>

  <!-- Row 4: Follow-up -->
  <g transform="translate(20, 330)">
    <rect width="400" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="16" y="16" width="104" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="68" y="36" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="700">Follow-up</text>
    <text x="136" y="34" fill="#0f172a" font-size="17" font-weight="700">Local summary on reply</text>
    <text x="136" y="56" fill="#64748b" font-size="14">Summarized in inbox · no bot loop</text>
  </g>

  <!-- Footer note -->
  <text x="220" y="442" text-anchor="middle" fill="#64748b" font-size="13">Standing task grants can be revoked</text>
</svg>
